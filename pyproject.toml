[project]
name = "gkb"
version = "0.1.0"
description = "GKB – generische KI-Wissensschicht (Prototyp)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "openpyxl>=3.1",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Dokumente lesen (PDF, Office inkl. Tabellen, OCR)
parse = ["docling>=2.0"]
# NER-basierte Pseudonymisierung (zusätzlich zu Listen und Regeln)
ner = ["presidio-analyzer>=2.2", "spacy>=3.7"]
# LLM-Anbindung (Cloud oder lokal) und lokale Embeddings
llm = ["litellm>=1.50"]
mcp = ["mcp>=2.0,<3"]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
gkb = "gkb.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
