# GPU-Erweiterung (Hetzner GEX44: NVIDIA RTX 4000 SFF Ada, 20 GB).
# Aktivieren in .env:   COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
# Voraussetzung:        sudo bash scripts/gpu-setup.sh (Treiber + NVIDIA Container Toolkit)
#
# - app: Docling (Layout-Erkennung, OCR) und Embeddings laufen auf der GPU
# - llm: lokales Sprachmodell mit vLLM, OpenAI-kompatibel unter http://llm:8000/v1 (nur intern)
#        Start nur bei Bedarf:  docker compose --profile lokal up -d llm

services:
  app:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Modelle von Docling und Embeddings nur einmal laden
      - ${GKB_DATA_DIR:-./data}/modelle:/root/.cache

  llm:
    # Version nach dem ersten erfolgreichen Test festschreiben, z. B. vllm/vllm-openai:vX.Y.Z
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["lokal"]
    restart: unless-stopped
    ipc: host
    command:
      - "--model=${GKB_LLM_MODELL:-Qwen/Qwen2.5-7B-Instruct-AWQ}"
      - "--served-model-name=gkb-lokal"
      # Anteil des GPU-Speichers für vLLM; der Rest bleibt für Docling und Embeddings
      - "--gpu-memory-utilization=${GKB_LLM_GPU_ANTEIL:-0.6}"
      - "--max-model-len=${GKB_LLM_MAX_LEN:-16384}"
      - "--max-num-seqs=${GKB_LLM_PARALLEL:-8}"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${GKB_DATA_DIR:-./data}/modelle/huggingface:/root/.cache/huggingface
    # Kein Port nach außen: nur im internen Docker-Netz erreichbar
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
